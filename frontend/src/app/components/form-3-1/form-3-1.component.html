<form [formGroup]="form31" (ngSubmit)="onSubmit()" class="p-4 sm:p-6 max-w-6xl mx-auto bg-white shadow-lg rounded-xl">
  <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-6 text-blue-900 border-b pb-2">新生兒科轉診記錄表 (Form 3-1)</h2>

  <div formGroupName="transferInfo" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6 sm:mb-8 bg-blue-50 p-3 sm:p-4 rounded">
    <app-datetime-24h formControlName="callTime" aria-label="接獲轉介時間"></app-datetime-24h>
    <input formControlName="caller" class="border p-2.5 rounded w-full min-w-0" placeholder="接獲電話者">
    <app-time-24h formControlName="departTime" aria-label="出發時間"></app-time-24h>
    <app-time-24h formControlName="arrivalTime" aria-label="抵達時間"></app-time-24h>
    <textarea formControlName="reason" class="sm:col-span-2 border p-2.5 rounded w-full min-h-[80px]" placeholder="轉介原因"></textarea>
    <textarea formControlName="treatmentDone" class="sm:col-span-2 border p-2.5 rounded w-full min-h-[80px]" placeholder="已做處理"></textarea>
  </div>

  <div formGroupName="arrivalStatus" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6 sm:mb-8">
    <input type="number" formControlName="hr" placeholder="心率 (bpm)" class="border p-2.5 rounded w-full min-w-0" inputmode="numeric" min="0" step="1">
    <input type="number" formControlName="rr" placeholder="呼吸 (min)" class="border p-2.5 rounded w-full min-w-0" inputmode="numeric" min="0" step="1">
    <input formControlName="bp" placeholder="血壓" class="border p-2.5 rounded w-full min-w-0">
    <input type="number" formControlName="bt" placeholder="體溫 (°C)" class="border p-2.5 rounded w-full min-w-0" inputmode="decimal" step="0.1">
    <div class="col-span-1 sm:col-span-2 lg:col-span-4 flex flex-col sm:flex-row flex-wrap gap-3 sm:gap-4 items-stretch sm:items-center border-t pt-4">
      <label class="inline-flex items-center gap-2 min-h-[44px]"><input type="checkbox" formControlName="o2Use" class="w-4 h-4"> 使用 O2</label>
      <input type="number" formControlName="o2Flow" placeholder="供給量 L/min" class="border p-2.5 rounded w-full sm:w-auto sm:min-w-[140px] flex-1" inputmode="decimal" min="0" step="0.1">
      <label class="inline-flex items-center gap-2 min-h-[44px]"><input type="checkbox" formControlName="intubated" class="w-4 h-4"> 插管</label>
      <input type="number" formControlName="fio2" placeholder="FiO2 %" class="border p-2.5 rounded w-full sm:w-auto sm:min-w-[120px] flex-1" inputmode="numeric" min="21" max="100" step="1">
    </div>
  </div>

  <div class="overflow-x-auto -mx-1 px-1">
    <table class="w-full min-w-[480px] border-collapse border text-sm">
      <thead>
        <tr class="bg-gray-100">
          <th class="border p-2 text-left">評估項目</th>
          <th class="border p-2">0分</th>
          <th class="border p-2">1分</th>
          <th class="border p-2">2分</th>
        </tr>
      </thead>
      <tbody formArrayName="assessments">
        <tr *ngFor="let row of assessmentControls.controls; let i=index" [formGroupName]="i">
          <td class="border p-2 font-bold whitespace-nowrap">{{ row.value.item }}</td>
          <td class="border p-2"><input type="number" formControlName="score0" class="w-14 sm:w-16 border p-1.5 rounded" inputmode="numeric" min="0" max="2" step="1"></td>
          <td class="border p-2"><input type="number" formControlName="score1" class="w-14 sm:w-16 border p-1.5 rounded" inputmode="numeric" min="0" max="2" step="1"></td>
          <td class="border p-2"><input type="number" formControlName="score2" class="w-14 sm:w-16 border p-1.5 rounded" inputmode="numeric" min="0" max="2" step="1"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <button type="submit" class="mt-6 w-full bg-blue-600 text-white py-3.5 rounded-lg hover:bg-blue-700 font-semibold text-base min-h-[48px]">儲存轉診紀錄</button>
</form>
