<div class="max-w-4xl mx-auto p-4 sm:p-6 md:p-8">
  <div class="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-2 border-b-2 border-blue-600 pb-4 mb-6 sm:mb-8">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">新生兒外接登錄表</h1>
      <p class="text-sm text-gray-500 mt-1">Neonatal Extra-mural Transfer Registry (Form 2)</p>
    </div>
    <div class="sm:text-right">
      <span class="text-base sm:text-lg font-semibold text-blue-600">2024年 紀錄</span>
    </div>
  </div>

  <form [formGroup]="form2" (ngSubmit)="onSubmit()" class="bg-white shadow-2xl rounded-2xl p-4 sm:p-6 md:p-8 border border-gray-100">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">

      <div class="flex flex-col">
        <label class="text-sm font-bold text-gray-700 mb-1">外接日期時間</label>
        <app-datetime-24h formControlName="transferDateTime"></app-datetime-24h>
      </div>

      <div class="flex flex-col">
        <label class="text-sm font-bold text-gray-700 mb-1">外接院所名稱</label>
        <input type="text" formControlName="hospitalName" placeholder="請輸入醫療院所名稱"
          class="border-2 border-gray-200 rounded-lg p-2.5 focus:border-blue-500 outline-none w-full min-w-0">
      </div>

      <div class="flex flex-col">
        <label class="text-sm font-bold text-gray-700 mb-1">紀錄類型</label>
        <select formControlName="recordType" class="border-2 border-gray-200 rounded-lg p-2.5 bg-white outline-none w-full min-w-0">
          <option value="prenatal">產前紀錄 (導向 Form 3-1)</option>
          <option value="postnatal">產後紀錄 (導向 Form 3-2)</option>
        </select>
      </div>

      <div class="flex flex-col">
        <label class="text-sm font-bold text-gray-700 mb-1">登錄者簽章</label>
        <input type="text" formControlName="registrar" placeholder="請輸入姓名"
          class="border-2 border-gray-200 rounded-lg p-2.5 outline-none w-full min-w-0">
      </div>

      <div class="md:col-span-2 flex flex-col">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-1">
          <label class="text-sm font-bold text-gray-700">轉院原因</label>
          <button type="button"
            class="self-start sm:self-auto px-4 py-2.5 rounded-lg border-2 border-blue-200 bg-blue-50 text-blue-700 font-semibold text-sm min-h-[48px] min-w-[140px] disabled:opacity-60 disabled:cursor-not-allowed active:bg-blue-100 touch-none select-none"
            style="touch-action: none; user-select: none; -webkit-user-select: none;"
            (pointerdown)="onPointerDown($event)"
            (pointerup)="onPointerUp($event)"
            (pointercancel)="onPointerCancel($event)"
            [disabled]="voiceDisabled"
            [class.recording]="isRecording">
            {{ micLabel }}
          </button>
        </div>
        <p class="text-xs text-gray-500 mb-2">{{ statusHint }}</p>
        @if (isRecording) {
          <div class="mb-2 h-1.5 rounded-full bg-gray-100 overflow-hidden" aria-hidden="true">
            <div
              class="h-full bg-blue-500 transition-[width] duration-75"
              [style.width.%]="voiceLevel() * 100"
            ></div>
          </div>
        }
        <p *ngIf="draftHint" class="text-xs text-emerald-600 mb-2">{{ draftHint }}</p>
        <p *ngIf="!network.online()" class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mb-2">
          目前離線：可繼續填表與暫存；語音辨識需連線後再使用。送出後會排入同步佇列。
        </p>
        <textarea formControlName="transferReason" rows="3"
          class="border-2 border-gray-200 rounded-lg p-2.5 outline-none focus:border-blue-500 w-full min-w-0"></textarea>
      </div>

      <div class="flex flex-wrap items-center gap-3 sm:gap-4 p-3 bg-gray-50 rounded-lg">
        <label class="text-sm font-bold text-gray-700">是否執行外接:</label>
        <label class="flex items-center gap-1.5 min-h-[44px]">
          <input type="radio" [value]="true" formControlName="isTransferred" class="w-4 h-4"> <span>是</span>
        </label>
        <label class="flex items-center gap-1.5 min-h-[44px]">
          <input type="radio" [value]="false" formControlName="isTransferred" class="w-4 h-4"> <span>否</span>
        </label>
      </div>

      <div *ngIf="showNoTransferReason"
        class="md:col-span-2 flex flex-col bg-red-50 p-4 rounded-lg border border-red-200">
        <label class="text-sm font-bold text-red-700 mb-1">請輸入未外接原因</label>
        <input type="text" formControlName="noTransferReason"
          class="border-2 border-red-200 rounded-lg p-2.5 outline-none w-full min-w-0">
      </div>

      <div class="flex flex-col">
        <label class="text-sm font-bold text-gray-700 mb-1">小時回覆 (hr)</label>
        <input type="number" formControlName="replyHours" class="border-2 border-gray-200 rounded-lg p-2.5 outline-none w-full min-w-0" inputmode="numeric">
      </div>

      <div class="flex flex-col">
        <label class="text-sm font-bold text-gray-700 mb-1">滿意度</label>
        <select formControlName="satisfaction" class="border-2 border-gray-200 rounded-lg p-2.5 bg-white outline-none w-full min-w-0">
          <option value="">請選擇</option>
          <option value="5">非常滿意</option>
          <option value="4">滿意</option>
          <option value="3">普通</option>
          <option value="2">不滿意</option>
        </select>
      </div>
    </div>

    <div class="mt-8 sm:mt-10 flex flex-col-reverse sm:flex-row gap-3 sm:gap-4">
      <button type="button" (click)="clearForm()"
        class="w-full sm:flex-1 py-3.5 border-2 border-gray-200 rounded-xl font-bold text-gray-500 hover:bg-gray-50 transition min-h-[48px]">
        清除重填
      </button>
      <button type="submit" [disabled]="submitting"
        class="w-full sm:flex-1 py-3.5 bg-blue-600 text-white rounded-xl font-bold text-base sm:text-lg hover:bg-blue-700 shadow-lg shadow-blue-200 transition transform active:scale-95 min-h-[48px] disabled:opacity-60 disabled:cursor-not-allowed">
        {{ submitting ? '處理中…' : (network.online() ? '確認登錄並跳轉' : '離線暫存並繼續') }}
      </button>
    </div>
  </form>

  <div class="mt-6 text-xs text-gray-400 space-y-1 px-1 sm:px-2">
    <p>1. 務必詳加協助填寫未外接原因。</p>
    <p>2. 請每月更新最新表單內容。</p>
  </div>
</div>
